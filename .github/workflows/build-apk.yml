name: Build APK

on:
  push:
    branches: ['telegram-12.10.5']
    paths: ['app/**', 'settingsadapter/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'tests/release/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['app/**', 'settingsadapter/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'tests/release/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/TeleVip-unsigned.apk
          (cd artifacts && sha256sum TeleVip-unsigned.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TeleVip-${{ github.sha }}-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: build
    # A fresh runner signs only this repository's trusted branch. PRs never access the key.
    if: >-
      github.repository == 'ceigt/TeleVip-LSPosed' &&
      github.ref == 'refs/heads/telegram-12.10.5' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TeleVip-${{ github.sha }}-unsigned
          path: artifacts
      - name: Check unsigned artifact
        run: cd artifacts && sha256sum --check SHA256SUMS.txt
      - name: Sign with the existing release key
        shell: bash
        env:
          TELEVIP_KEYSTORE_BASE64: ${{ secrets.TELEVIP_KEYSTORE_BASE64 }}
          TELEVIP_KEYSTORE_PASSWORD: ${{ secrets.TELEVIP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TELEVIP_KEYSTORE_BASE64" && test -n "$TELEVIP_KEYSTORE_PASSWORD" || {
            echo 'Release signing secrets are missing' >&2
            exit 1
          }
          key_file="$(mktemp "$RUNNER_TEMP/televip-signing.XXXXXX")"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "$TELEVIP_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          unset TELEVIP_KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f 4 artifacts/TeleVip-unsigned.apk "$RUNNER_TEMP/televip-aligned.apk"
          mkdir -p signed
          "$tools/apksigner" sign --ks "$key_file" --ks-key-alias televip \
            --ks-pass env:TELEVIP_KEYSTORE_PASSWORD --key-pass env:TELEVIP_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out signed/TeleVip-signed.apk "$RUNNER_TEMP/televip-aligned.apk"
      - name: Verify signed APK and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = Get-Content app/build.gradle -Raw
          $versionCode = [regex]::Match($gradle, '(?m)^\s*versionCode\s+(\d+)\s*$').Groups[1].Value
          $versionName = [regex]::Match($gradle, '(?m)^\s*versionName\s+"([A-Za-z0-9._-]+)"\s*$').Groups[1].Value
          if (-not $versionCode -or -not $versionName) { throw 'Release version metadata unavailable' }
          ./tests/release/verify.ps1 -Apk signed/TeleVip-signed.apk -Sdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME -ExpectedVersionCode ([int]$versionCode) -ExpectedVersionName $versionName
          $name = "TeleVip-$versionName.apk"
          Move-Item -LiteralPath signed/TeleVip-signed.apk -Destination "signed/$name"
          $hash = (Get-FileHash -LiteralPath "signed/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/signed/SHA256SUMS.txt", "$hash  $name`n")
          $info = [ordered]@{
            source_commit = $env:GITHUB_SHA
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            package = 'org.televip'
            version_code = [int]$versionCode
            version_name = $versionName
            unsigned_sha256 = (Get-FileHash artifacts/TeleVip-unsigned.apk -Algorithm SHA256).Hash.ToLowerInvariant()
            signed_sha256 = $hash
            certificate_sha256 = '60f2274c49aac137bd0cc6a30b522f8930c95fe19c53ba7c2469a939665a2efc'
          }
          $info | ConvertTo-Json | Set-Content signed/SIGNING-INFO.json -Encoding utf8
          "### Original-certificate signed APK`n`n$name`n`nSHA256: $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TeleVip-${{ github.sha }}-signed
          path: |
            signed/*.apk
            signed/SHA256SUMS.txt
            signed/SIGNING-INFO.json
          if-no-files-found: error
          retention-days: 30
