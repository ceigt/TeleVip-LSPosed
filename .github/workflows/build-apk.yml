name: Build APK

on:
  push:
    branches: ['telegram-12.10.5']
    paths: ['app/**', 'settingsadapter/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['app/**', 'settingsadapter/**', 'gradle/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build release APK for local signing
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/TeleVip-unsigned.apk
          sha256sum artifacts/TeleVip-unsigned.apk > artifacts/SHA256SUMS.txt
      # Sign the downloaded artifact locally with the existing release certificate.
      - uses: actions/upload-artifact@v4
        with:
          name: TeleVip-${{ github.sha }}-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
