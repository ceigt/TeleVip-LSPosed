name: Verified Play compatibility
on:
  push:
    paths: ['app/**', 'tests/compat/**', 'tests/regression/**', '.github/workflows/**']
  pull_request:
    paths: ['app/**', 'tests/compat/**', 'tests/regression/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require real Play audit for these exact source inputs
        run: python3 tests/compat/evidence.py --verify
      # Telegram APKs are not redistributed. This checks a source-bound local APK audit,
      # not a new cloud APK run, server behavior, or authorization to publish a release.
