name: Client APK compatibility
on:
  push:
    paths: ['app/src/main/**', 'tests/compat/**', '.github/workflows/client-compat.yml']
  pull_request:
    paths: ['app/src/main/**', 'tests/compat/**', '.github/workflows/client-compat.yml']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional direct client APK URL; default checks telegram.org'
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the current Telegram APK
        env:
          INPUT_URL: ${{ inputs.apk_url }}
        run: |
          url="${INPUT_URL:-https://telegram.org/dl/android/apk}"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output client.apk "$url"
      - name: Audit the actual APK
        run: python3 tests/compat/run.py --apk client.apk --output app/build/client-watch
      - name: Save compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-compatibility
          path: |
            app/build/client-watch/*.tsv
            app/build/client-watch/mapping.txt
            app/build/client-watch/*.md
            app/build/client-watch/*.txt
          if-no-files-found: warn
      # Static compatibility alone never authorizes publishing a release.
